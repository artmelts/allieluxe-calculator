const ITERATIONS = 310000;
const KEY = 'allieluxe-calc-pw';
const MSG = { opening: 'Opening…', wrong: "That password didn't work. Please try again." };
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(PAYLOAD.salt), iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(PAYLOAD.iv) }, key, bytes(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function tryOpen(password, remember) {
  try {
    const html = await unlock(password);
    try { remember ? localStorage.setItem(KEY, password) : localStorage.removeItem(KEY); } catch (e) {}
    show(html);
    return true;
  } catch (e) {
    return false;
  }
}

document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('err');
  err.textContent = MSG.opening;
  const ok = await tryOpen(document.getElementById('pw').value.trim(), document.getElementById('remember').checked);
  if (!ok) err.textContent = MSG.wrong;
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && !(await tryOpen(saved, true))) {
    try { localStorage.removeItem(KEY); } catch (e) {}
  }
})();
})();
</script>
